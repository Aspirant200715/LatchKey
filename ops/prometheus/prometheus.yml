global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: latchkey-api
    metrics_path: /metrics
    static_configs:
      - targets: [order-api:8081]
        labels:
          service: api
  - job_name: latchkey-relay
    metrics_path: /metrics
    static_configs:
      - targets: [relay:8081]
        labels:
          service: relay
  - job_name: latchkey-consumer
    metrics_path: /metrics
    static_configs:
      - targets: [consumer:8081]
        labels:
          service: consumer
