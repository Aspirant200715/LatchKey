server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS:50}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  flyway:
    locations: classpath:db/migration/orders

latchkey:
  consumer-status:
    base-url: ${CONSUMER_STATUS_URL:http://localhost:8083}
